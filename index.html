<title>Gym Logger</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
:root{
  --bg:#f5f4f1; --surface:#ffffff; --surface2:#eceae5; --ink:#1c1e22; --muted:#6b7078;
  --line:#dcdad4; --accent:#3f6fc4; --accent-ink:#ffffff; --good:#2f8a58; --good-bg:#e2f2e8;
  --bad:#c14f4f; --bad-bg:#f7e4e4; --chip:#e7e5e0;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#101318; --surface:#1a1f26; --surface2:#232933; --ink:#edeae3; --muted:#8b929c;
    --line:#2b323c; --accent:#6fa1f2; --accent-ink:#0d1117; --good:#4cc07d; --good-bg:#1d3328;
    --bad:#e07070; --bad-bg:#3a2222; --chip:#2a3038;
  }
}
:root[data-theme="dark"]{
  --bg:#101318; --surface:#1a1f26; --surface2:#232933; --ink:#edeae3; --muted:#8b929c;
  --line:#2b323c; --accent:#6fa1f2; --accent-ink:#0d1117; --good:#4cc07d; --good-bg:#1d3328;
  --bad:#e07070; --bad-bg:#3a2222; --chip:#2a3038;
}
:root[data-theme="light"]{
  --bg:#f5f4f1; --surface:#ffffff; --surface2:#eceae5; --ink:#1c1e22; --muted:#6b7078;
  --line:#dcdad4; --accent:#3f6fc4; --accent-ink:#ffffff; --good:#2f8a58; --good-bg:#e2f2e8;
  --bad:#c14f4f; --bad-bg:#f7e4e4; --chip:#e7e5e0;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:16px; line-height:1.4;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
}
#app{max-width:480px; margin:0 auto; padding:14px 14px 0}
h1{font-size:22px; font-weight:800; letter-spacing:-.3px; margin:6px 2px 14px}
.back{display:inline-flex; align-items:center; gap:4px; color:var(--accent); font-weight:700; font-size:15px; padding:8px 4px 2px; margin-left:-4px}
.numin{width:100%; border:1px solid var(--line); border-radius:8px; background:var(--surface2); color:var(--ink); padding:9px; font:inherit}
h1 small{display:block; font-size:12px; font-weight:600; color:var(--muted); letter-spacing:.08em; text-transform:uppercase; margin-bottom:2px}
.num{font-variant-numeric:tabular-nums}
.card{background:var(--surface); border:1px solid var(--line); border-radius:14px; margin-bottom:12px; overflow:hidden}
.card-pad{padding:14px}
button{font:inherit; color:inherit; border:none; background:none; cursor:pointer; touch-action:manipulation}
button:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

/* home */
.bigbtn{
  display:block; width:100%; text-align:left; background:var(--accent); color:var(--accent-ink);
  border-radius:14px; padding:18px 16px; margin-bottom:12px;
}
.bigbtn .eyebrow{font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; opacity:.75}
.bigbtn .t{font-size:24px; font-weight:800; letter-spacing:-.3px}
.daygrid{display:flex; flex-direction:column; gap:10px; margin-bottom:12px}
.daybtn{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px 14px; text-align:left; display:flex; align-items:center; justify-content:space-between; gap:10px}
.daybtn .t{font-weight:800; font-size:18px}
.daybtn .fx{color:var(--accent); font-weight:700; font-size:15px; margin-top:2px}
.daybtn .s{font-size:12px; color:var(--muted); text-align:right; flex:none}

/* collapsible */
.fold-head{display:flex; width:100%; align-items:center; justify-content:space-between; padding:13px 14px; font-weight:700; text-align:left}
.fold-head .arr{color:var(--muted); transition:transform .15s}
.fold.open .fold-head .arr{transform:rotate(90deg)}
.fold-body{display:none; padding:0 14px 14px; color:var(--muted); font-size:14px}
.fold.open .fold-body{display:block}
.fold-body ul{margin:6px 0; padding-left:18px}
.fold-body li{margin:3px 0}
@media (prefers-reduced-motion: reduce){ .fold-head .arr{transition:none} }

/* exercise cards */
.ex-head{display:flex; width:100%; align-items:center; gap:10px; padding:13px 14px; text-align:left}
.ex-head .name{font-weight:700; flex:1; min-width:0}
.ex-head .sum{font-size:13px; color:var(--muted); white-space:nowrap}
.ex-done-dot{width:10px; height:10px; border-radius:50%; background:var(--line); flex:none}
.ex-done-dot.on{background:var(--good)}
.ex-done-dot.fail{background:var(--bad)}
.ex-body{display:none; border-top:1px solid var(--line); padding:12px 14px 14px}
.ex.open .ex-body{display:block}
.badge{display:inline-block; font-size:12px; font-weight:700; border-radius:99px; padding:3px 10px; margin:0 6px 8px 0}
.badge.up{background:var(--good-bg); color:var(--good)}
.badge.tgt{background:var(--chip); color:var(--muted)}
.badge.pr{background:var(--good); color:#fff}
.badge.dl{background:var(--bad-bg); color:var(--bad)}
.wrow{display:flex; align-items:center; gap:10px; margin-bottom:10px}
.wrow .lbl{font-size:13px; color:var(--muted); width:58px}
.stp{
  width:52px; height:44px; border-radius:10px; background:var(--surface2); border:1px solid var(--line);
  font-size:22px; font-weight:700; flex:none; display:flex; align-items:center; justify-content:center;
}
.stp:active{background:var(--chip)}
.wval{font-size:20px; font-weight:800; min-width:84px; text-align:center}
.setrow{display:flex; align-items:center; gap:10px; padding:5px 0}
.setrow .lbl{font-size:13px; color:var(--muted); width:64px; white-space:nowrap}
.stp.txt{width:50px; font-size:14px; font-weight:700}
.setrow .reps{font-size:20px; font-weight:800; min-width:44px; text-align:center; color:var(--muted)}
.setrow.done .reps{color:var(--ink)}
.chk{
  width:52px; height:44px; border-radius:10px; border:1px solid var(--line); background:var(--surface2);
  font-size:20px; color:var(--muted); flex:none; margin-left:auto;
  display:flex; align-items:center; justify-content:center;
}
.setrow.done .chk{background:var(--good); border-color:var(--good); color:#fff}
.exfoot{display:flex; align-items:center; gap:8px; margin-top:10px; flex-wrap:wrap}
.fbtn{
  border:1px solid var(--line); background:var(--surface2); border-radius:10px;
  padding:10px 16px; font-weight:800; font-size:15px;
}
.fbtn.on{background:var(--bad); border-color:var(--bad); color:#fff}
.hint{font-size:12px; color:var(--muted)}

.primary{
  display:block; width:100%; background:var(--accent); color:var(--accent-ink);
  border-radius:14px; padding:16px; font-size:17px; font-weight:800; text-align:center; margin:16px 0 8px;
}
.ghost{
  display:block; width:100%; border:1px solid var(--line); background:var(--surface);
  border-radius:12px; padding:13px; font-weight:600; text-align:center; margin-bottom:10px; color:var(--muted);
}
.danger{color:var(--bad)}

/* history */
.sess{padding:13px 14px}
.sess + .sess{border-top:1px solid var(--line)}
.sess-head{display:flex; align-items:center; gap:8px; margin-bottom:6px}
.sess-head .d{font-weight:800}
.sess-head .del{margin-left:auto; color:var(--muted); font-size:14px; padding:4px 8px}
.sess ul{margin:0; padding-left:16px; font-size:14px}
.sess li{margin:2px 0}
.flag-f{color:var(--bad); font-weight:800}
.flag-p{color:var(--good); font-weight:800}
textarea{
  width:100%; min-height:90px; border:1px solid var(--line); background:var(--surface2); color:var(--ink);
  border-radius:10px; padding:10px; font:inherit; font-size:13px;
}

/* schema editor */
.schx{display:flex; width:100%; align-items:center; gap:10px; padding:11px 14px; text-align:left}
.schx + .schx, .schx + .edit, .edit + .schx{border-top:1px solid var(--line)}
.schx .name{font-weight:600; flex:1}
.schx .sum{font-size:12px; color:var(--muted); white-space:nowrap}
.edit{border-top:1px solid var(--line); padding:12px 14px; background:var(--surface2)}
.edit label{display:block; font-size:12px; color:var(--muted); margin:8px 0 3px}
.edit input[type=text],.edit input[type=number]{
  width:100%; border:1px solid var(--line); border-radius:8px; background:var(--surface); color:var(--ink);
  padding:9px; font:inherit;
}
.edit .row2{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px}
.edit .btns{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap}
.edit .btns .fbtn{padding:9px 13px; font-size:14px; font-weight:600}
.cbrow{display:flex; align-items:center; gap:8px; margin-top:10px; font-size:14px}
.cbrow input{width:20px; height:20px}
.dayhead{padding:12px 14px 4px; font-size:12px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
.addbtn{display:block; width:100%; text-align:center; padding:11px; color:var(--accent); font-weight:700; border-top:1px solid var(--line)}

/* progressie */
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chip{padding:8px 13px; border-radius:99px; border:1px solid var(--line); background:var(--surface2); font-weight:600; font-size:14px}
.chip.on{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
#chartwrap{position:relative; margin-top:10px}
#pchart{width:100%; height:240px; display:block; touch-action:pan-y}
#tip{position:absolute; top:6px; left:8px; background:var(--surface2); border:1px solid var(--line); border-radius:8px; padding:5px 10px; font-size:12px; font-weight:600; pointer-events:none; display:none; white-space:nowrap}
.statrow{display:flex; gap:8px; margin-top:12px}
.stat{flex:1; background:var(--surface2); border-radius:10px; padding:9px 6px; text-align:center}
.stat .v{font-weight:800; font-size:16px}
.stat .l{font-size:11px; color:var(--muted); margin-top:1px}

/* tab bar */
#tabs{
  position:fixed; bottom:0; left:0; right:0; background:var(--surface); border-top:1px solid var(--line);
  display:flex; justify-content:space-around; padding:6px 0 calc(6px + env(safe-area-inset-bottom));
}
#tabs button{flex:1; padding:8px 0 6px; color:var(--muted); font-size:11px; font-weight:600}
#tabs button.on{color:var(--accent)}
#tabs .ico{display:block; font-size:20px; margin-bottom:1px}
.toast{
  position:fixed; bottom:calc(84px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%);
  background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:99px; font-size:14px; font-weight:600;
  opacity:0; pointer-events:none; transition:opacity .2s; white-space:nowrap; z-index:9;
}
.toast.show{opacity:1}
.empty{color:var(--muted); text-align:center; padding:26px 14px; font-size:14px}
</style>

<div id="app"></div>
<nav id="tabs">
  <button data-tab="train"><span class="ico">🏋️</span>Training</button>
  <button data-tab="hist"><span class="ico">📓</span>Historie</button>
  <button data-tab="prog"><span class="ico">📈</span>Progressie</button>
  <button data-tab="freq"><span class="ico">📅</span>Frequentie</button>
  <button data-tab="schema"><span class="ico">🛠️</span>Schema</button>
</nav>
<div class="toast" id="toast"></div>

<script>
'use strict';
const LS_KEY='gymlogger-v2';
const SEED_LOG=[]; // historie staat niet in de code: herstel via Sync in de app

/* ---------- seed: schema + laatste trainingen (uit Notes, jul 2026) ---------- */
function seed(){
  const D=(id,name,warm,ex)=>({id,name,warm,ex});
  const E=(id,name,w,sets,target,step,bw)=>({id,name,w,sets,target,step,bw:!!bw});
  const days=[
    D('ua','Upper A','upper',[
      E('bench','Bench',50,4,10,2.5), E('rowA','Row machine',60,3,10,5),
      E('latr','Lat raise',20,4,20,2), E('pull','Neutral grip pull-ups',0,4,12,0,true),
      E('dips','Dips',0,3,12,0,true), E('curl','Seated db bicep curl',24,3,12,2),
    ]),
    D('la','Lower A','lower',[
      E('rdl','RDL',92,4,12,2.5), E('hackA','Hack squat machine',50,4,12,5),
      E('legxA','Leg ext',55,3,12,5), E('calfA','Calf press 1L',70,3,25,5),
      E('rotA','Rotary torso machine',30,3,20,5), E('crunch','Mach crunch',30,3,20,5),
    ]),
    D('ub','Upper B','upper',[
      E('incdb','Incl db press',52,4,10,2), E('rowB','Row machine',65,4,10,5),
      E('ohp','OH press',36,3,10,2.5), E('fly','Pec fly',30,3,12,5),
      E('rpd','Rev pec deck',20,3,12,5), E('preach','Incl preach curl',14,3,12,2),
    ]),
    D('lb','Lower B','lower',[
      E('hex','Hexbar deadlift',70,4,10,2.5), E('hackB','Hack squat machine',50,4,12,5),
      E('legxB','Leg ext',55,3,12,5), E('rotB','Rot torso machine',25,3,20,5),
      E('calfB','Calf press 1L',70,3,25,5), E('hlr','Hanging leg raises',0,3,20,0,true),
    ]),
  ];
  const log = (typeof structuredClone==='function')? structuredClone(SEED_LOG) : JSON.parse(JSON.stringify(SEED_LOG));
  return {v:2, days, log, draft:null};
}

/* ---------- state ---------- */
let S;
try{ S=JSON.parse(localStorage.getItem(LS_KEY)) }catch(e){ S=null }
if(!S || !S.days){ S=seed(); persist(); }
function persist(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(S)) }catch(e){} }

let tab='train';
let openEdit=null;   // 'dayId/exId' in schema-editor
let homeOverride=false; // true = toon overzicht ondanks actieve training
let histShown=25;       // aantal getoonde sessies in Historie (oplopend via "toon meer")
let progSel=null;       // canon-sleutel van gekozen oefening in Progressie
let progRange='1j';     // '3m' | '1j' | 'all'
let freqMode='week';    // 'week' | 'maand' in Frequentie-tab

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtW=w=>(Math.round(w*100)/100).toString().replace('.',',');
const WD=['Zo','Ma','Di','Wo','Do','Vr','Za'], MON=['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
function dstr(iso){ const d=new Date(iso+'T12:00:00'); return WD[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()]; }
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),1800); }
function lastEntry(dayId,exId){
  for(let i=S.log.length-1;i>=0;i--){
    if(S.log[i].dayId!==dayId) continue;
    const e=S.log[i].entries.find(x=>x.exId===exId);
    if(e) return e;
  }
  return null;
}
function lastByName(name,n){
  // laatste n keer dat deze oefening voorkwam, over ALLE dagen heen (Leg ext in Lower A telt ook voor Lower B)
  const out=[];
  for(let i=S.log.length-1;i>=0 && out.length<n;i--){
    const e=S.log[i].entries.find(x=>chartMatch(x.name,name));
    if(e) out.push({e, date:S.log[i].date});
  }
  return out; // nieuwste eerst
}
function histMax(name,bw){ // hoogste ooit over de hele log (zelfde naam-matching als de grafiek)
  let m=null;
  S.log.forEach(s=>s.entries.forEach(e=>{
    if(!chartMatch(e.name,name)) return;
    const v=bw? Math.max(...e.reps) : (e.w>0? e.w : null);
    if(v!=null && (m==null||v>m)) m=v;
  }));
  return m;
}
function draftPRs(d){
  return d.entries.filter(e=>draftEntryDone(e) && e.prMax!=null &&
    (e.bw? e.sets.some(s=>s.done && s.reps>e.prMax) : e.w>e.prMax)).length;
}
function hitTarget(e){ return !!e.target && e.reps.length>0 && Math.min(...e.reps)>=e.target; }
const WARMUP={
  upper:['Arm Circles – 10 voor/achter','Scapula Push-ups – 10','Cat-Cow – 10','Thread the Needle – 10 per kant','Push-up to Downward Dog – 10'],
  lower:['Cat-Cow – 10','World’s Greatest Stretch – 5 per kant','Bodyweight Squats – 10 (diep, langzaam)','Glute Bridges – 15','Bird Dog – 10 per kant'],
};
const RULES=['Mind-muscle connection','Focus bottom half','Laatste set tot falen','Compounds 6–10 reps','Isolatie 10–15 reps','Drop set: laatste set −30% gewicht, door tot falen','Rest-pause: 5 sec stop bij falen, dan nog 2–3 reps','Eccentrisch: 3 sec laten zakken'];

/* alternatieven per schema-oefening (sleutel = canonP van de naam) */
const ALTS={};
[['Bench',['Db bench press','Chest press machine','Smith machine bench']],
 ['Row machine',['Seated cable row','Bent-over row','Db row']],
 ['Lat raise',['Cable lateral raise','Machine lateral raise']],
 ['Neutral grip pull-ups',['Lat pulldown','Assisted pull-ups','Chin-ups']],
 ['Dips',['Assisted dips','Triceps pushdown','Skullcrushers']],
 ['Seated db bicep curl',['Cable curl','EZ-bar curl','Hammer curl']],
 ['RDL',['Back extension','Hip thrust','Good mornings']],
 ['Hack squat machine',['Leg press','Smith machine squat','Bulgarian split squats']],
 ['Leg ext',['Leg press (voeten laag)','Sissy squat']],
 ['Calf press 1L',['Standing calf raise','Seated calf raise','Leg press calf extension']],
 ['Rotary torso machine',['Cable woodchopper','Russian twists']],
 ['Mach crunch',['Cable crunch','Decline crunches']],
 ['Incl db press',['Incl barbell press','Incl chest press machine','Low-to-high cable fly']],
 ['OH press',['Db shoulder press','Machine shoulder press','Smith machine OH press']],
 ['Pec fly',['Cable fly','Db fly op bank']],
 ['Rev pec deck',['Face pulls','Rear delt fly db']],
 ['Incl preach curl',['Preacher curl machine','Spider curl']],
 ['Hexbar deadlift',['Deadlift','RDL','Leg press']],
 ['Hanging leg raises',["Captain's chair leg raise",'Lying leg raises','Mach crunch']],
].forEach(p=>{ ALTS[canonP(p[0])]=p[1]; });
const ALT_BW=new Set(['Chin-ups','Assisted pull-ups','Assisted dips','Lying leg raises',"Captain's chair leg raise",'Sissy squat','Decline crunches'].map(canonP));

/* ---------- draft (actieve training) ---------- */
function buildEntry(x, exId, schemaName){
  const hist=lastByName(x.name,2);
  const last=hist[0]? hist[0].e : null;
  let w=x.w, up=false, deload=false, prefill=[];
  const lr=i=> last.reps[Math.min(i,last.reps.length-1)] ?? x.target;
  const inc=(last && last.plus2)? 2 : 1;   // +2-vlag van vorige keer versnelt de opbouw
  if(last){
    if(!x.bw) w=last.w;
    if(hitTarget(last)){
      up=true;
      if(x.bw){ for(let i=0;i<x.sets;i++) prefill.push(lr(i)+inc); }               // bodyweight: doel gehaald -> reps omhoog
      else { w=last.w+x.step; for(let i=0;i<x.sets;i++) prefill.push(Math.max(1,lr(i)-3)); } // nieuw gewicht -> reps terug
    }else if(last.fail){
      for(let i=0;i<x.sets;i++) prefill.push(lr(i));                                // gefaald -> zelfde nog eens
    }else{
      for(let i=0;i<x.sets;i++) prefill.push(x.target? Math.min(lr(i)+inc,x.target) : lr(i)+inc); // gelukt -> +1 (of +2) rep
    }
  }else{
    for(let i=0;i<x.sets;i++) prefill.push(x.target||10);
  }
  if(!x.bw && !up && hist.length===2 && hist[0].e.fail && hist[1].e.fail){
    w=Math.round(last.w*0.9*2)/2; deload=true;                                      // 2x f op rij -> stel -10% voor
    prefill=prefill.map((r,i)=> last? lr(i) : r);
  }
  let prev='';
  if(last){
    const allEq=last.reps.every(r=>r===last.reps[0]);
    prev='('+dstr(hist[0].date)+') '+(last.bw?'':fmtW(last.w)+' kg · ')+(allEq? last.reps.length+'×'+last.reps[0] : last.reps.join('/'))+(last.fail?' · f':'');
  }
  return {exId, name:x.name, schemaName:schemaName||x.name, w, bw:x.bw, target:x.target, step:x.step, up, deload,
          prMax:histMax(x.name,x.bw), prev,
          sets:prefill.map(r=>({reps:r,done:false})), fail:false, plus2:false, showAlts:false};
}
function startDraft(dayId){
  const day=S.days.find(d=>d.id===dayId);
  const entries=day.ex.map(x=>buildEntry(x, x.id));
  S.draft={dayId, date:todayISO(), entries, open:0};
  homeOverride=false;
  persist(); render();
}
function draftEntryDone(e){ return e.sets.some(s=>s.done); }
function finishDraft(){
  const d=S.draft;
  const entries=d.entries.filter(draftEntryDone).map(e=>({
    exId:e.exId, name:e.name, w:e.w, bw:e.bw, target:e.target,
    reps:e.sets.filter(s=>s.done).map(s=>s.reps), fail:e.fail,
    ...(e.plus2? {plus2:true} : {}),
  }));
  if(!entries.length){ toast('Nog geen sets afgevinkt'); return; }
  const prs=draftPRs(d);
  S.log.push({id:d.date+'-'+d.dayId+'-'+S.log.length, date:d.date, dayId:d.dayId, entries});
  // schema bijwerken naar laatst gebruikte gewicht
  const day=S.days.find(x=>x.id===d.dayId);
  entries.forEach(e=>{ const x=day.ex.find(x=>x.id===e.exId); if(x&&!x.bw) x.w=e.w; });
  S.draft=null; persist(); render();
  toast(prs? 'Opgeslagen · '+prs+'× nieuw PR! 🎉' : 'Training opgeslagen 💪');
  syncPush(false);
}

/* ---------- sync naar gist (voor weekrapport op laptop) ---------- */
const SYNC_KEY='gymlogger-sync';
function syncCfg(){ try{ return JSON.parse(localStorage.getItem(SYNC_KEY))||{} }catch(e){ return {} } }
async function syncPush(manual){
  const cfg=syncCfg();
  if(!cfg.token || !cfg.gistId){ if(manual) toast('Vul eerst token en gist-ID in'); return; }
  try{
    const content=JSON.stringify({updated:new Date().toISOString(), days:S.days, log:S.log});
    const r=await fetch('https://api.github.com/gists/'+cfg.gistId,{
      method:'PATCH',
      headers:{'Authorization':'Bearer '+cfg.token,'Accept':'application/vnd.github+json'},
      body:JSON.stringify({files:{'gym-logger-data.json':{content}}})
    });
    if(!r.ok) throw new Error(syncErr(r.status));
    cfg.lastSync=new Date().toISOString();
    localStorage.setItem(SYNC_KEY,JSON.stringify(cfg));
    if(manual){ toast('Gesynct ✓'); render(); }
  }catch(e){ if(manual) toast('Sync mislukt: '+e.message); }
}
function syncErr(status){
  if(status===401||status===403) return 'token ongeldig — plak een nieuwe token';
  if(status===404) return 'gist-ID klopt niet';
  return 'HTTP '+status;
}
async function syncPull(){
  const cfg=syncCfg();
  if(!cfg.token || !cfg.gistId){ toast('Vul eerst token en gist-ID in (Schema-tab)'); return; }
  try{
    const r=await fetch('https://api.github.com/gists/'+cfg.gistId,{
      headers:{'Authorization':'Bearer '+cfg.token,'Accept':'application/vnd.github+json'}
    });
    if(!r.ok) throw new Error(syncErr(r.status));
    const g=await r.json();
    const f=g.files && g.files['gym-logger-data.json'];
    if(!f) throw new Error('bestand niet gevonden in gist');
    const data=JSON.parse(f.truncated? await (await fetch(f.raw_url)).text() : f.content);
    if(!data.days || !data.log) throw new Error('onbekend formaat');
    if(!confirm('Historie ophalen van sync ('+data.log.length+' trainingen, laatst bijgewerkt '+String(data.updated).slice(0,10)+')? Dit vervangt de data op dit toestel.')) return;
    S.days=data.days; S.log=data.log; S.draft=null;
    persist(); render(); toast('Hersteld vanaf sync ✓');
  }catch(e){ toast('Ophalen mislukt: '+e.message); }
}
/* eenmalige setup via link: #gist=<id> stelt het sync-adres automatisch in */
(function(){
  const m=location.hash.match(/#gist=([a-f0-9]{16,40})/i);
  if(!m) return;
  const cfg=syncCfg();

  history.replaceState(null,'',location.pathname+location.search);

})();

function entryLine(e){
  const allEq=e.reps.every(r=>r===e.reps[0]);
  const setsStr=allEq? e.reps.length+'x'+e.reps[0] : e.reps.join('/');
  const wStr=e.bw?'':' '+fmtW(e.w)+'kg';
  const plus=hitTarget(e)?' +':'';
  const tgtStr=e.target?' (→'+e.target+')':'';
  return '– '+e.name+wStr+' '+setsStr+tgtStr+(e.fail?' f':'')+plus;
}
function sessionText(s){ return dstr(s.date)+':\n'+s.entries.map(e=>'\t'+entryLine(e)).join('\n'); }

/* ---------- import uit iPhone Notes ---------- */
function canonName(s){
  return s.toLowerCase().replace(/[^a-z0-9]/g,'')
    .replace('rotary','rot').replace('incline','incl').replace('preacher','preach')
    .replace('dumbbell','db').replace('machine','');
}
function sameEx(a,b){ const x=canonName(a), y=canonName(b); return x===y || (x.length>3 && y.length>3 && (x.includes(y)||y.includes(x))); }
function parseNoteLine(body){
  let t=body.trim(), fail=false, m;
  while((m=t.match(/\s([fF+])\s*$/))){ if(m[1].toLowerCase()==='f') fail=true; t=t.slice(0,m.index); }
  let target=null;
  t=t.replace(/\(\s*(?:→|->|—>|–>|>)?\s*(\d+)\s*\)/,(mm,g)=>{ target=+g; return ''; });
  let sets=null, reps=null;
  t=t.replace(/(\d+)\s*[xX×]\s*(\d+)/,(mm,a,b)=>{ sets=+a; reps=+b; return ''; });
  if(sets==null) return null;
  let w=null;
  t=t.replace(/(\d+(?:[.,]\d+)?)\s*kg/i,(mm,g)=>{ w=parseFloat(g.replace(',','.')); return ''; });
  const name=t.replace(/\s+/g,' ').trim().replace(/[-–:]+$/,'').trim();
  if(!name) return null;
  return {name, w, bw:w==null, sets, reps, target, fail};
}
function importNotes(){
  const ta=$('#imp-ta'), yr=parseInt($('#imp-year').value);
  if(!ta.value.trim()){ toast('Plak eerst je notities'); return; }
  if(!yr || yr<2015 || yr>2100){ toast('Vul een geldig jaartal in'); return; }
  const MM={jan:0,feb:1,mrt:2,mar:2,apr:3,mei:4,may:4,jun:5,jul:6,aug:7,sep:8,okt:9,oct:9,nov:10,dec:11};
  const dayRe=/^\s*(ma|di|wo|do|vr|za|zo)\s+(\d{1,2})\s+([a-z]{3})/i;
  let year=yr, prevD=null, cur=null, skippedLines=0;
  const sessions=[];
  ta.value.split(/\r?\n/).forEach(raw=>{
    const line=raw.trim(); if(!line) return;
    const dm=line.match(dayRe);
    if(dm){
      const mon=MM[dm[3].toLowerCase()];
      if(mon==null){ cur=null; return; }
      let dt=new Date(year, mon, +dm[2], 12);
      if(prevD && dt<prevD){ year++; dt=new Date(year, mon, +dm[2], 12); }
      prevD=dt;
      const iso=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
      cur={date:iso, entries:[]}; sessions.push(cur); return;
    }
    const em=line.match(/^[–\-−•∙·]\s*(.+)$/);
    if(!em || !cur) return;
    const p=parseNoteLine(em[1]);
    if(p) cur.entries.push(p); else skippedLines++;
  });
  let added=0, dupes=0;
  sessions.filter(s=>s.entries.length).forEach(s=>{
    let best=null, bestScore=0;
    S.days.forEach(d=>{
      const sc=s.entries.filter(e=>d.ex.some(x=>sameEx(x.name,e.name))).length;
      if(sc>bestScore){ bestScore=sc; best=d; }
    });
    const day=bestScore>=2? best : null;
    const dayId=day? day.id : 'imp';
    if(S.log.some(l=>l.date===s.date && l.dayId===dayId)){ dupes++; return; }
    const entries=s.entries.map(e=>{
      const x=day? day.ex.find(x=>sameEx(x.name,e.name)) : null;
      return {exId: x? x.id : 'imp-'+canonName(e.name), name:e.name, w:e.w==null?0:e.w, bw:e.bw,
              reps:Array(e.sets).fill(e.reps), fail:e.fail, target: e.target!=null? e.target : (x? x.target : null)};
    });
    S.log.push({id:s.date+'-'+dayId+'-'+Math.random().toString(36).slice(2,7), date:s.date, dayId, entries});
    added++;
  });
  S.log.sort((a,b)=> a.date<b.date? -1 : a.date>b.date? 1 : 0);
  persist(); render();
  alert('Import klaar:\n• '+added+' trainingen toegevoegd\n• '+dupes+' overgeslagen (stonden er al in)'+(skippedLines?'\n• '+skippedLines+' regels niet herkend':''));
}

}

  h+='<input type="text" class="numin" id="s-gist" value="'+esc(cfg.gistId||'')+'" placeholder="bijv. 3a1b…" style="margin-top:4px">';
  h+='<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><button class="fbtn" data-a="save-token">Opslaan</button><button class="fbtn" data-a="syncnow">Sync nu</button><button class="fbtn" data-a="syncpull">Herstel vanaf sync</button></div>';
  h+='<p class="hint" style="margin:10px 0 0">'+(cfg.lastSync? 'Laatste sync: '+dstr(cfg.lastSync.slice(0,10))+' '+cfg.lastSync.slice(11,16) : 'Nog niet gesynct.')+'</p></div>';
  h+='<p class="hint" style="margin:4px 2px 20px">Gewichten hier zijn het startpunt; na elke training wordt het laatst gebruikte gewicht automatisch onthouden. Data staat in deze browser op dit toestel — maak af en toe een backup via Historie.</p>';
  return h;
}

/* ---------- progressie ---------- */
function canonP(s){
  s=s.toLowerCase().replace(/[^a-z0-9]/g,'')
    .replace('rotary','rot').replace('incline','incl').replace('preacher','preach')
    .replace('dumbbell','db').replace('machine','')
    .replace('militarypress','ohpress').replace('overheadpress','ohpress')
    .replace('romaniandeadlift','rdl');
  if(s.endsWith('s')) s=s.slice(0,-1);
  return s;
}
function chartMatch(a,b){ const x=canonP(a), y=canonP(b); return x===y || (x.length>3 && y.length>3 && (x.startsWith(y)||y.startsWith(x))); }
function progExercises(){
  const seen={}, list=[];
  S.days.forEach(d=>d.ex.forEach(x=>{ const k=canonP(x.name); if(!seen[k]){ seen[k]=1; list.push({key:k, name:x.name, bw:x.bw}); } }));
  return list;
}
function progSeries(exName, bw){
  const pts=[];
  S.log.forEach(s=>{
    let v=null;
    s.entries.forEach(e=>{
      if(!chartMatch(e.name, exName)) return;
      const val = bw? Math.max(...e.reps) : (e.w>0? e.w : null);
      if(val!=null && (v==null || val>v)) v=val;
    });
    if(v!=null) pts.push({date:s.date, v});
  });
  if(progRange!=='all'){
    const d=new Date(); d.setMonth(d.getMonth()-(progRange==='3m'?3:12));
    const cut=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    return pts.filter(p=>p.date>=cut);
  }
  return pts;
}
function drawProg(hoverI){
  const cv=$('#pchart'); if(!cv) return;
  const pts=cv._pts||[], bw=cv._bw;
  const dpr=window.devicePixelRatio||1, W=cv.clientWidth, H=240;
  if(W<10) return; // (nog) niet zichtbaar; resize-listener tekent alsnog
  if(cv.width!==W*dpr){ cv.width=W*dpr; cv.height=H*dpr; }
  const ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H);
  const css=getComputedStyle(document.documentElement);
  const C={line:css.getPropertyValue('--line').trim(), muted:css.getPropertyValue('--muted').trim(),
           accent:css.getPropertyValue('--accent').trim(), good:css.getPropertyValue('--good').trim(),
           ink:css.getPropertyValue('--ink').trim()};
  if(pts.length<2){ ctx.fillStyle=C.muted; ctx.font='13px sans-serif'; ctx.fillText('Te weinig data voor een grafiek', 12, 30); return; }
  const L=44, R=14, T=16, B=26, iw=W-L-R, ih=H-T-B;
  const t0=new Date(pts[0].date).getTime(), t1=new Date(pts[pts.length-1].date).getTime();
  let vmin=Math.min(...pts.map(p=>p.v)), vmax=Math.max(...pts.map(p=>p.v));
  if(vmin===vmax){ vmin-=5; vmax+=5; }
  const pad=(vmax-vmin)*0.1; vmin=Math.max(0,vmin-pad); vmax+=pad;
  const X=p=>L+iw*((new Date(p.date).getTime()-t0)/Math.max(1,t1-t0));
  const Y=v=>T+ih*(1-(v-vmin)/(vmax-vmin));
  // grid + y-labels (3 lijnen)
  ctx.font='11px sans-serif'; ctx.textAlign='right'; ctx.textBaseline='middle';
  for(let i=0;i<=2;i++){
    const v=vmin+(vmax-vmin)*i/2, y=Y(v);
    ctx.strokeStyle=C.line; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(L,y); ctx.lineTo(W-R,y); ctx.stroke();
    ctx.fillStyle=C.muted; ctx.fillText((bw? Math.round(v) : fmtW(Math.round(v*2)/2)), L-6, y);
  }
  // x-labels: eerste en laatste
  ctx.textAlign='left'; ctx.textBaseline='top';
  const xl=d=>{ const dt=new Date(d); return MON[dt.getMonth()]+" '"+String(dt.getFullYear()).slice(2); };
  ctx.fillText(xl(pts[0].date), L, H-B+6);
  ctx.textAlign='right'; ctx.fillText(xl(pts[pts.length-1].date), W-R, H-B+6);
  // lijn
  ctx.strokeStyle=C.accent; ctx.lineWidth=2; ctx.lineJoin='round'; ctx.lineCap='round';
  ctx.beginPath();
  pts.forEach((p,i)=>{ const x=X(p),y=Y(p.v); i? ctx.lineTo(x,y) : ctx.moveTo(x,y); });
  ctx.stroke();
  // PR-punt (eerste keer dat het maximum werd gehaald)
  const prV=Math.max(...pts.map(p=>p.v));
  const pr=pts.find(p=>p.v===prV);
  ctx.fillStyle=C.good;
  ctx.beginPath(); ctx.arc(X(pr),Y(pr.v),5,0,7); ctx.fill();
  // eindpunt
  const lastP=pts[pts.length-1];
  ctx.fillStyle=C.accent;
  ctx.beginPath(); ctx.arc(X(lastP),Y(lastP.v),4,0,7); ctx.fill();
  // hover/crosshair
  const tip=$('#tip');
  if(hoverI!=null && pts[hoverI]){
    const p=pts[hoverI], x=X(p);
    ctx.strokeStyle=C.muted; ctx.lineWidth=1; ctx.setLineDash([3,3]);
    ctx.beginPath(); ctx.moveTo(x,T); ctx.lineTo(x,H-B); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle=C.ink;
    ctx.beginPath(); ctx.arc(x,Y(p.v),4,0,7); ctx.fill();
    tip.textContent=dstr(p.date)+" '"+p.date.slice(2,4)+' · '+(bw? p.v+' reps' : fmtW(p.v)+' kg');
    tip.style.display='block';
  }else if(tip){ tip.style.display='none'; }
}
function progPointerBind(){
  const cv=$('#pchart'); if(!cv) return;
  const pick=ev=>{
    const r=cv.getBoundingClientRect(), pts=cv._pts||[];
    if(!pts.length) return;
    const px=(ev.touches? ev.touches[0].clientX : ev.clientX)-r.left;
    let bi=0, bd=1e12;
    const t0=new Date(pts[0].date).getTime(), t1=new Date(pts[pts.length-1].date).getTime();
    pts.forEach((p,i)=>{
      const x=44+(r.width-44-14)*((new Date(p.date).getTime()-t0)/Math.max(1,t1-t0));
      const d=Math.abs(x-px); if(d<bd){ bd=d; bi=i; }
    });
    drawProg(bi);
  };
  cv.addEventListener('pointermove',pick);
  cv.addEventListener('pointerdown',pick);
  cv.addEventListener('pointerleave',()=>drawProg(null));
}
function vProg(){
  const list=progExercises();
  if(!progSel || !list.some(x=>x.key===progSel)) progSel=list.length? list[0].key : null;
  const sel=list.find(x=>x.key===progSel);
  let h='<h1><small>PR-verloop per oefening</small>Progressie</h1>';
  h+='<div class="card card-pad"><div class="chips">'+list.map(x=>'<button class="chip'+(x.key===progSel?' on':'')+'" data-a="psel" data-k="'+x.key+'">'+esc(x.name)+'</button>').join('')+'</div></div>';
  if(sel){
    const pts=progSeries(sel.name, sel.bw);
    const prV=pts.length? Math.max(...pts.map(p=>p.v)) : 0;
    const pr=pts.find(p=>p.v===prV);
    const unit=sel.bw?' reps':' kg';
    const fmtV=v=>sel.bw? v : fmtW(v);
    h+='<div class="card card-pad"><div style="font-weight:700">'+esc(sel.name)+' <span class="hint">('+(sel.bw?'max reps':'topgewicht')+' per training)</span></div>';
    h+='<div class="chips" style="margin-top:10px">'+[['3m','3 mnd'],['1j','1 jaar'],['all','Alles']].map(r=>'<button class="chip'+(progRange===r[0]?' on':'')+'" data-a="prange" data-r="'+r[0]+'">'+r[1]+'</button>').join('')+'</div>';
    h+='<div id="chartwrap"><canvas id="pchart"></canvas><div id="tip"></div></div>';
    if(pts.length){
      h+='<div class="statrow num">';
      h+='<div class="stat"><div class="v" style="color:var(--good)">'+fmtV(prV)+unit+'</div><div class="l">'+(progRange==='all'?'PR':'hoogste')+' · '+dstr(pr.date)+" '"+pr.date.slice(2,4)+'</div></div>';
      h+='<div class="stat"><div class="v">'+fmtV(pts[pts.length-1].v)+unit+'</div><div class="l">laatste</div></div>';
      h+='<div class="stat"><div class="v">'+pts.length+'</div><div class="l">trainingen</div></div>';
      h+='</div>';
      h+='<p class="hint" style="margin:10px 0 0">Tik of sleep over de grafiek voor losse punten. Groen = eerste keer op je PR.</p>';
    }
    h+='</div>';
  }
  return h;
}

/* ---------- frequentie ---------- */
function isoD(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function freqCounts(){
  const dates=[...new Set(S.log.map(s=>s.date))].sort();
  const out=[], now=new Date();
  if(freqMode==='week'){
    const mon=new Date(now); mon.setDate(now.getDate()-((now.getDay()+6)%7)); // maandag deze week
    for(let i=25;i>=0;i--){
      const a=new Date(mon); a.setDate(mon.getDate()-7*i);
      const b=new Date(a); b.setDate(a.getDate()+7);
      out.push({label:a.getDate()+' '+MON[a.getMonth()], n:dates.filter(x=>x>=isoD(a)&&x<isoD(b)).length, cur:i===0});
    }
  }else{
    for(let i=23;i>=0;i--){
      const a=new Date(now.getFullYear(), now.getMonth()-i, 1);
      const b=new Date(now.getFullYear(), now.getMonth()-i+1, 1);
      out.push({label:MON[a.getMonth()]+" '"+String(a.getFullYear()).slice(2), n:dates.filter(x=>x>=isoD(a)&&x<isoD(b)).length, cur:i===0});
    }
  }
  return out;
}
function drawFreq(hoverI){
  const cv=$('#fchart'); if(!cv) return;
  const data=cv._data||[];
  const dpr=window.devicePixelRatio||1, W=cv.clientWidth, H=210;
  if(W<10) return;
  if(cv.width!==W*dpr){ cv.width=W*dpr; cv.height=H*dpr; }
  const ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H);
  const css=getComputedStyle(document.documentElement);
  const C={line:css.getPropertyValue('--line').trim(), muted:css.getPropertyValue('--muted').trim(),
           accent:css.getPropertyValue('--accent').trim(), ink:css.getPropertyValue('--ink').trim()};
  if(!data.length) return;
  const L=26, R=8, T=12, B=24, iw=W-L-R, ih=H-T-B;
  const vmax=Math.max(4, ...data.map(d=>d.n));
  ctx.font='11px sans-serif';
  // gridlijnen op hele aantallen
  const step=vmax>6? 2 : 1;
  for(let v=0; v<=vmax; v+=step){
    const y=T+ih*(1-v/vmax);
    ctx.strokeStyle=C.line; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(L,y); ctx.lineTo(W-R,y); ctx.stroke();
    ctx.fillStyle=C.muted; ctx.textAlign='right'; ctx.textBaseline='middle'; ctx.fillText(v, L-6, y);
  }
  const bw=iw/data.length;
  data.forEach((d,i)=>{
    if(!d.n) return;
    const h=ih*d.n/vmax, x=L+i*bw+bw*0.18, y=T+ih-h;
    ctx.fillStyle=C.accent; ctx.globalAlpha=(hoverI==null||hoverI===i)?1:.45;
    ctx.beginPath();
    ctx.roundRect? ctx.roundRect(x,y,bw*0.64,h,[3,3,0,0]) : ctx.rect(x,y,bw*0.64,h);
    ctx.fill(); ctx.globalAlpha=1;
  });
  // x-labels: eerste en laatste
  ctx.fillStyle=C.muted; ctx.textBaseline='top';
  ctx.textAlign='left'; ctx.fillText(data[0].label, L, H-B+6);
  ctx.textAlign='right'; ctx.fillText('nu', W-R, H-B+6);
  const tip=$('#ftip');
  if(hoverI!=null && data[hoverI]){
    const d=data[hoverI];
    tip.textContent=(freqMode==='week'?'week van ':'')+d.label+' · '+d.n+'×';
    tip.style.display='block';
  }else if(tip){ tip.style.display='none'; }
}
function freqPointerBind(){
  const cv=$('#fchart'); if(!cv) return;
  const pick=ev=>{
    const r=cv.getBoundingClientRect(), data=cv._data||[];
    if(!data.length) return;
    const px=(ev.touches? ev.touches[0].clientX : ev.clientX)-r.left;
    const i=Math.max(0, Math.min(data.length-1, Math.floor((px-26)/((r.width-34)/data.length))));
    drawFreq(i);
  };
  cv.addEventListener('pointermove',pick);
  cv.addEventListener('pointerdown',pick);
  cv.addEventListener('pointerleave',()=>drawFreq(null));
}
function vFreq(){
  const data=freqCounts();
  const cur=data[data.length-1].n;
  const prev12=data.slice(-13,-1);
  const avg=prev12.length? Math.round(prev12.reduce((a,d)=>a+d.n,0)/prev12.length*10)/10 : 0;
  const best=Math.max(...data.map(d=>d.n));
  let h='<h1><small>Hoe consistent train ik?</small>Frequentie</h1>';
  h+='<div class="card card-pad">';
  h+='<div class="chips">'+[['week','Per week'],['maand','Per maand']].map(r=>'<button class="chip'+(freqMode===r[0]?' on':'')+'" data-a="fmode" data-m="'+r[0]+'">'+r[1]+'</button>').join('')+'</div>';
  h+='<div id="chartwrap"><canvas id="fchart" style="width:100%;height:210px;display:block;touch-action:pan-y"></canvas><div id="ftip" style="position:absolute;top:6px;left:8px;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:12px;font-weight:600;pointer-events:none;display:none;white-space:nowrap"></div></div>';
  h+='<div class="statrow num">';
  h+='<div class="stat"><div class="v">'+cur+'×</div><div class="l">deze '+(freqMode==='week'?'week':'maand')+'</div></div>';
  h+='<div class="stat"><div class="v">'+String(avg).replace('.',',')+'×</div><div class="l">gem. laatste 12</div></div>';
  h+='<div class="stat"><div class="v">'+best+'×</div><div class="l">beste</div></div>';
  h+='</div>';
  h+='<p class="hint" style="margin:10px 0 0">'+(freqMode==='week'?'Laatste 26 weken':'Laatste 24 maanden')+' · tik op een staaf voor het aantal.</p>';
  h+='</div>';
  return h;
}

/* ---------- events ---------- */
document.getElementById('tabs').addEventListener('click',ev=>{
  const b=ev.target.closest('button'); if(!b) return;
  tab=b.dataset.tab; openEdit=null; render();
  window.scrollTo(0,0);
});

document.getElementById('app').addEventListener('click',ev=>{
  const b=ev.target.closest('[data-a]'); if(!b) return;
  const a=b.dataset.a;

  if(a==='fold'){ document.getElementById(b.dataset.f).classList.toggle('open'); return; }
  if(a==='resume'){ homeOverride=false; render(); window.scrollTo(0,0); return; }
  if(a==='start'){
    if(S.draft){
      if(S.draft.dayId===b.dataset.day){ homeOverride=false; render(); return; }
      const day=S.days.find(x=>x.id===S.draft.dayId);
      if(S.draft.entries.some(draftEntryDone)){
        if(!confirm('Je hebt nog een training openstaan ('+day.name+'). Die weggooien en deze starten?')) return;
      }
      S.draft=null;
    }
    startDraft(b.dataset.day); window.scrollTo(0,0); return;
  }

  if(S.draft){
    const d=S.draft;
    if(a==='back'){
      if(!d.entries.some(draftEntryDone)){ S.draft=null; } // niets ingevuld → gewoon weggooien
      else homeOverride=true;
      persist(); render(); window.scrollTo(0,0); return;
    }
    if(a==='addset'){ const e=d.entries[+b.dataset.i]; e.sets.push({reps:e.sets[e.sets.length-1].reps, done:false}); persist(); render(); return; }
    if(a==='rmset'){
      const e=d.entries[+b.dataset.i];
      if(e.sets.length<=1) return;
      const s=e.sets[e.sets.length-1];
      if(s.done && !confirm('Laatste set is al afgevinkt. Toch verwijderen?')) return;
      e.sets.pop(); persist(); render(); return;
    }
    if(a==='exopen'){ const i=+b.dataset.i; d.open = d.open===i? -1 : i; persist(); render(); return; }
    if(a==='w'){ const e=d.entries[+b.dataset.i]; e.w=Math.max(0,Math.round((e.w + parseFloat(b.dataset.d))*100)/100); e.up=false; e.deload=false; persist(); render(); return; }
    if(a==='plus2'){ const e=d.entries[+b.dataset.i]; e.plus2=!e.plus2; persist(); render(); return; }
    if(a==='alt'){ const e=d.entries[+b.dataset.i]; e.showAlts=!e.showAlts; persist(); render(); return; }
    if(a==='swap'){
      const i=+b.dataset.i, e=d.entries[i], name=b.dataset.n;
      if(e.sets.some(s=>s.done) && !confirm('Al afgevinkte sets van deze oefening gaan verloren. Toch wisselen?')) return;
      const day=S.days.find(x=>x.id===d.dayId);
      const x=day.ex.find(x=>x.name===e.schemaName) || {name:e.schemaName, w:0, sets:e.sets.length, target:e.target, step:e.step||2.5, bw:e.bw, id:e.exId};
      const terug = name===x.name;
      const spec={name, w: terug? x.w : 0, sets:x.sets, target:x.target, step:x.step||2.5, bw: terug? x.bw : ALT_BW.has(canonP(name))};
      d.entries[i]=buildEntry(spec, terug? x.id : 'alt-'+canonP(name), x.name);
      d.entries[i].showAlts=false;
      persist(); render(); return;
    }
    if(a==='r'){ const e=d.entries[+b.dataset.i], s=e.sets[+b.dataset.j]; s.reps=Math.max(0,s.reps+(+b.dataset.d)); s.done=true; persist(); render(); return; }
    if(a==='done'){
      const i=+b.dataset.i, e=d.entries[i], s=e.sets[+b.dataset.j];
      s.done=!s.done; persist();
      if(e.sets.every(x=>x.done)){ // alles af → volgende oefening openen
        const nx=d.entries.findIndex((x,k)=>k>i && !x.sets.every(s=>s.done));
        d.open = nx>=0? nx : -1; persist();
      }
      render(); return;
    }
    if(a==='fail'){ const e=d.entries[+b.dataset.i]; e.fail=!e.fail; persist(); render(); return; }
    if(a==='finish'){ finishDraft(); return; }
    if(a==='cancel'){ if(confirm('Training afbreken? Ingevoerde sets gaan verloren.')){ S.draft=null; persist(); render(); } return; }
  }

  if(a==='del'){
    const s=S.log.find(x=>x.id===b.dataset.id);
    if(s && confirm('Training van '+dstr(s.date)+' verwijderen?')){ S.log=S.log.filter(x=>x.id!==s.id); persist(); render(); }
    return;
  }
  if(a==='copyall'){ copyText(allText()); return; }
  if(a==='morehist'){ histShown+=100; render(); return; }
  if(a==='psel'){ progSel=b.dataset.k; render(); return; }
  if(a==='prange'){ progRange=b.dataset.r; render(); return; }
  if(a==='fmode'){ freqMode=b.dataset.m; render(); return; }
  if(a==='save-token'){
    const v=$('#s-token').value.trim(), g=$('#s-gist').value.trim();
    const cfg=syncCfg();
    if(v) cfg.token=v;
    if(g) cfg.gistId=g;
    if(v||g){ localStorage.setItem(SYNC_KEY,JSON.stringify(cfg)); render(); toast('Opgeslagen'); }
    else toast('Vul token en/of gist-ID in');
    return;
  }
  if(a==='syncnow'){ syncPush(true); return; }
  if(a==='syncpull'){ syncPull(); return; }
  if(a==='import'){ importNotes(); return; }
  if(a==='backup'){ backup(); return; }
  if(a==='restore'){ restore(); return; }

  if(a==='edit'){ openEdit = openEdit===b.dataset.k? null : b.dataset.k; render(); return; }
  if(a==='save-ex'||a==='del-ex'||a==='mv'){
    const [dayId,exId]=b.dataset.k.split('/');
    const day=S.days.find(x=>x.id===dayId); const i=day.ex.findIndex(x=>x.id===exId);
    if(a==='del-ex'){
      if(confirm('Oefening "'+day.ex[i].name+'" verwijderen uit het schema? (Historie blijft bewaard.)')){ day.ex.splice(i,1); openEdit=null; persist(); render(); }
      return;
    }
    if(a==='mv'){
      const j=i+(+b.dataset.d);
      if(j>=0&&j<day.ex.length){ const t=day.ex[i]; day.ex[i]=day.ex[j]; day.ex[j]=t; persist(); render(); }
      return;
    }
    const x=day.ex[i];
    x.name=$('#e-name').value.trim()||x.name;
    x.bw=$('#e-bw').checked;
    x.w=x.bw?0:(parseFloat($('#e-w').value)||0);
    x.sets=Math.max(1,parseInt($('#e-sets').value)||x.sets);
    x.target=Math.max(1,parseInt($('#e-target').value)||x.target);
    x.step=x.bw?0:(parseFloat($('#e-step').value)||0);
    openEdit=null; persist(); render(); toast('Opgeslagen');
    return;
  }
  if(a==='add-ex'){
    const day=S.days.find(x=>x.id===b.dataset.day);
    const id='x'+Date.now().toString(36);
    day.ex.push({id, name:'Nieuwe oefening', w:20, sets:3, target:12, step:2.5, bw:false});
    openEdit=day.id+'/'+id; persist(); render();
    return;
  }
});

window.addEventListener('resize',()=>{ if(tab==='prog') drawProg(null); if(tab==='freq') drawFreq(null); });

render();
</script>
